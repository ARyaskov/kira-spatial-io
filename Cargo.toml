[package]
name = "kira-spatial-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Deterministic spatial transcriptomics IO primitives for Kira."
repository = "https://github.com/ARyaskov/kira-spatial-io"
keywords = [
    "bioinformatics",
    "spatial",
    "transcriptomics",
    "visium",
    "oncology"
]
categories = [
    "science",
    "science::bioinformatics",
    "science::bioinformatics::genomics"
]

[features]
default = []
parallel = ["dep:rayon"]
parquet = ["dep:arrow2", "dep:parquet2"]

[dependencies]
bitvec = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = { version = "1", optional = true }
flate2 = "1"
csv = "1"
memmap2 = "0.9"
hdf5 = "0.8"
hdf5-sys = { version = "0.8.1", features = ["static", "zlib"] }
ndarray = "0.15"
arrow2 = { version = "0.18", optional = true, default-features = false, features = ["io_parquet", "io_parquet_compression"] }
parquet2 = { version = "0.17", optional = true }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "performance"
harness = false
