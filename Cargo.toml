[package]
name = "kira-spatial-io"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Deterministic spatial transcriptomics IO primitives for Kira."
repository = "https://github.com/ARyaskov/kira-spatial-io"
keywords = [
    "bioinformatics",
    "spatial",
    "transcriptomics",
    "visium",
    "oncology"
]
categories = [
    "science",
    "science::bioinformatics",
    "science::bioinformatics::genomics"
]

[features]
default = ["hdf5", "parallel"]
parallel = ["dep:rayon"]
hdf5 = ["dep:hdf5", "dep:hdf5-sys"]
parquet = ["dep:arrow2", "dep:parquet2"]
compression = ["dep:zstd"]

[dependencies]
bitvec = "1.0.1"
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
crc32fast = "1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
rayon = { version = "1.12", optional = true }
flate2 = "1.1"
memmap2 = "0.9"
hdf5 = { package = "hdf5-metno", version = "0.12", optional = true }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.11", features = ["static", "zlib"], optional = true }
arrow2 = { version = "0.18", optional = true, default-features = false, features = ["io_parquet", "io_parquet_compression"] }
parquet2 = { version = "0.17", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "performance"
harness = false
required-features = ["hdf5"]
